<!-- 思维导图工坊 MindMap Studio · Mobile -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#F6F8F7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mindmap">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="./icon-192.png">

<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6F8F7; --grid:#E4EAE7; --ink:#1E2B2A; --ink-soft:#5C6B69;
    --panel:#FFFFFF; --line:#DCE4E1; --accent:#0E8A7B; --accent-soft:#E2F2EF;
    --danger:#C7484E;
    --font-ui:'Space Grotesk',"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    --font-node:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--font-ui);background:var(--paper);color:var(--ink);overflow:hidden}

  /* ---------- top bar ---------- */
  #topbar{position:fixed;top:0;left:0;right:0;height:52px;background:var(--panel);
    border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;
    padding:0 14px;z-index:30}
  #brand{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:.02em;white-space:nowrap}
  #brand .logo{width:26px;height:26px;border-radius:7px;background:var(--ink);color:#fff;
    display:grid;place-items:center;font-size:13px}
  #mapTitle{flex:1;min-width:0;border:1px solid transparent;border-radius:8px;padding:6px 10px;
    font:600 15px var(--font-ui);color:var(--ink);background:transparent;outline:none}
  #mapTitle:hover{border-color:var(--line)}
  #mapTitle:focus{border-color:var(--accent);background:#fff}
  #saveState{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-soft);white-space:nowrap}
  #saveDot{width:8px;height:8px;border-radius:50%;background:#9BB3AE}
  #saveDot.saved{background:var(--accent)}
  #saveDot.dirty{background:#D98E04}
  #saveDot.error{background:var(--danger)}
  .tbtn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 11px;
    font:500 13px var(--font-ui);color:var(--ink);cursor:pointer;white-space:nowrap}
  .tbtn:hover{border-color:var(--accent);color:var(--accent)}
  .tbtn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  #menuBtn{display:none}
  #exportWrap{position:relative}
  #exportMenu{position:absolute;top:calc(100% + 6px);right:0;background:var(--panel);
    border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 22px rgba(30,43,42,.14);
    padding:5px;display:none;flex-direction:column;min-width:150px;z-index:35}
  #exportMenu.open{display:flex}
  #exportMenu button{border:none;background:none;text-align:left;padding:8px 11px;border-radius:7px;
    font:500 13px var(--font-ui);color:var(--ink);cursor:pointer;white-space:nowrap}
  #exportMenu button:hover{background:var(--accent-soft);color:var(--accent)}

  /* ---------- sidebar (library) ---------- */
  #sidebar{position:fixed;top:52px;left:0;bottom:0;width:248px;background:var(--panel);
    border-right:1px solid var(--line);z-index:25;display:flex;flex-direction:column;
    transition:transform .2s ease}
  #sidebar h2{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);
    padding:14px 16px 8px}
  #newMapBtn{margin:0 12px 10px;padding:9px;border:1px dashed var(--accent);background:var(--accent-soft);
    color:var(--accent);border-radius:9px;font:600 13px var(--font-ui);cursor:pointer}
  #newMapBtn:hover{background:#d3ece7}
  #mapList{flex:1;overflow-y:auto;padding:0 8px 12px}
  .map-item{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:9px;
    cursor:pointer;border:1px solid transparent}
  .map-item:hover{background:#F2F6F4}
  .map-item.active{background:var(--accent-soft);border-color:#BFE0DA}
  .map-item .swatch{width:4px;height:26px;border-radius:3px;flex:none}
  .map-item .meta{flex:1;min-width:0}
  .map-item .name{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .map-item .time{font-size:11px;color:var(--ink-soft)}
  .map-item .del{border:none;background:none;color:var(--ink-soft);cursor:pointer;font-size:14px;
    padding:4px;border-radius:6px;visibility:hidden}
  .map-item:hover .del{visibility:visible}
  .map-item .del:hover{color:var(--danger);background:#FBECEC}
  #sideFoot{border-top:1px solid var(--line);padding:10px 12px;display:flex;gap:8px}
  #sideFoot .tbtn{flex:1;text-align:center;padding:7px 4px;font-size:12px}

  /* ---------- canvas ---------- */
  #stage{position:fixed;top:52px;left:248px;right:0;bottom:0;overflow:hidden;cursor:grab;
    background:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size:28px 28px;
    touch-action:none}
  #stage.panning{cursor:grabbing}
  svg{position:absolute;inset:0;width:100%;height:100%;display:block}
  .link{fill:none;stroke-width:2.2px;opacity:.85}
  .node-box{cursor:move}
  .node-box .node-resize-handle{fill:#fff;stroke:var(--accent);stroke-width:1.5;cursor:nwse-resize;display:none}
  .node-box.selected .node-resize-handle{display:block}
  .node-box rect{fill:#fff;stroke-width:2px}
  .node-box.root rect{fill:var(--ink);stroke:var(--ink)}
  .node-box.root text{fill:#fff}
  .node-box.selected rect{stroke-width:3px;filter:drop-shadow(0 2px 6px rgba(14,138,123,.35))}
  .node-box text{font:500 14px var(--font-node);fill:var(--ink);user-select:none}
  .toggle{cursor:pointer}
  .toggle circle{fill:#fff;stroke-width:1.6px}
  .toggle text{font:700 10px var(--font-ui);text-anchor:middle;user-select:none}

  /* ---------- floating toolbar ---------- */
  #toolbar{position:fixed;bottom:18px;left:calc(50% + 124px);transform:translateX(-50%);
    background:var(--panel);border:1px solid var(--line);border-radius:12px;
    box-shadow:0 6px 22px rgba(30,43,42,.12);display:flex;gap:4px;padding:6px;z-index:20;flex-wrap:wrap;justify-content:center}
  #toolbar button{border:none;background:none;border-radius:8px;padding:8px 11px;
    font:500 12.5px var(--font-ui);color:var(--ink);cursor:pointer;white-space:nowrap}
  #toolbar button:hover{background:var(--accent-soft);color:var(--accent)}
  #toolbar button:disabled{opacity:.35;cursor:default;background:none;color:var(--ink)}
  #toolbar .sep{width:1px;background:var(--line);margin:4px 3px}
  #toolbar kbd{font:600 10px var(--font-ui);color:var(--ink-soft);background:#F1F5F3;
    border:1px solid var(--line);border-radius:4px;padding:1px 4px;margin-left:5px}

  /* ---------- inline node editor ---------- */
  #nodeEditor{position:fixed;display:none;z-index:40;border:2px solid var(--accent);border-radius:9px;
    padding:5px 9px;font:500 14px var(--font-node);background:#fff;outline:none;min-width:60px;
    box-shadow:0 4px 14px rgba(14,138,123,.25)}

  /* ---------- toast & empty hint ---------- */
  #toast{position:fixed;top:64px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;
    padding:9px 16px;border-radius:9px;font-size:13px;z-index:50;display:none}
  #hint{position:fixed;bottom:78px;left:calc(50% + 124px);transform:translateX(-50%);
    font-size:12px;color:var(--ink-soft);z-index:15;background:rgba(246,248,247,.85);
    padding:4px 12px;border-radius:8px;pointer-events:none;text-align:center}

  /* ---------- note panel ---------- */
  #notePanel{position:fixed;top:52px;right:0;bottom:0;width:300px;background:var(--panel);
    border-left:1px solid var(--line);z-index:26;display:flex;flex-direction:column;
    transform:translateX(100%);transition:transform .2s ease;box-shadow:-4px 0 16px rgba(30,43,42,.06)}
  #notePanel.open{transform:none}
  #noteHead{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
  #noteTitle{flex:1;font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #noteClose{border:none;background:none;cursor:pointer;font-size:14px;color:var(--ink-soft);
    padding:4px 7px;border-radius:6px}
  #noteClose:hover{background:#F2F6F4;color:var(--danger)}
  #noteText{flex:1;border:none;outline:none;resize:none;padding:14px;
    font:400 13.5px var(--font-node);line-height:1.7;color:var(--ink);background:var(--panel)}
  #noteMeta{padding:8px 14px;font-size:11px;color:var(--ink-soft);border-top:1px solid var(--line)}
  .note-flag{font:700 13px var(--font-ui);cursor:pointer;user-select:none}

  /* ---------- free text ---------- */
  .free-text{cursor:move;user-select:none}
  .free-text text{font-family:var(--font-node);fill:var(--ink);dominant-baseline:hanging}
  .free-text.selected .free-text-hit{fill:rgba(14,138,123,.06);stroke:var(--accent);stroke-width:1.5;stroke-dasharray:5 4}
  .free-text-hit{fill:transparent;stroke:transparent;pointer-events:all}
  #freeTextEditor{position:fixed;display:none;z-index:42;min-width:120px;min-height:40px;resize:both;
    border:2px solid var(--accent);border-radius:8px;padding:6px 8px;background:#fff;color:var(--ink);
    font-family:var(--font-node);line-height:1.35;outline:none;box-shadow:0 4px 14px rgba(14,138,123,.25)}
  #toolbar button.freeTextOnly{display:none}
  #toolbar.free-text-selected button.freeTextOnly{display:inline-block}

  #scrim{display:none;position:fixed;inset:52px 0 0 0;background:rgba(30,43,42,.25);z-index:24}

  /* ---------- mobile-first interaction / layout ---------- */
  #topbar{height:50px;padding:0 8px;gap:6px;padding-top:env(safe-area-inset-top)}
  #brand .logo{width:30px;height:30px;border-radius:9px}
  #brand span.word{display:none}
  #menuBtn{display:inline-block;min-width:42px;min-height:40px;font-size:18px}
  #mapTitle{font-size:14px;padding:7px 6px;min-width:80px}
  #saveState{display:none}
  #topbar .tbtn{min-height:40px;padding:7px 9px}
  #exportBtn{font-size:0}
  #exportBtn::after{content:'导出';font-size:13px}
  #importBtn{display:none}
  #sidebar{top:50px;width:min(86vw,320px);transform:translateX(-100%);box-shadow:8px 0 28px rgba(30,43,42,.16)}
  #sidebar.open{transform:none}
  #scrim{inset:50px 0 0 0}
  #scrim.open{display:block}
  #stage{top:50px;left:0;bottom:76px;right:0}
  #toolbar{left:0;right:0;bottom:0;transform:none;border-radius:16px 16px 0 0;
    padding:7px max(8px,env(safe-area-inset-right)) calc(7px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));
    gap:5px;justify-content:flex-start;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;
    -webkit-overflow-scrolling:touch;scrollbar-width:none;box-shadow:0 -5px 22px rgba(30,43,42,.14)}
  #toolbar::-webkit-scrollbar{display:none}
  #toolbar button{flex:0 0 auto;min-width:58px;min-height:48px;padding:8px 10px;font-size:13px;background:#F7FAF9}
  #toolbar button:active{background:var(--accent-soft);color:var(--accent)}
  #toolbar .sep{height:36px;flex:0 0 1px;margin:6px 2px}
  #toolbar kbd{display:none}
  #hint{display:none}
  #notePanel{top:50px;width:100%;z-index:45}
  #noteHead{padding:14px 16px}
  #noteClose{font-size:20px;min-width:44px;min-height:44px}
  #noteText{font-size:16px;padding:18px;line-height:1.65}
  #nodeEditor{font-size:16px!important;min-height:44px;max-width:92vw}
  #freeTextEditor{font-size:16px!important;resize:none;min-width:180px;max-width:92vw;max-height:45vh}
  .node-resize-handle{width:26px!important;height:26px!important;transform:translate(-7px,-7px);stroke-width:2.5px!important}
  .toggle circle{stroke-width:2px}
  .free-text-hit{stroke-width:2px}
  #toast{top:62px;max-width:88vw;text-align:center;font-size:13px}

  @media (min-width:821px){
    body::before{content:'此版本针对手机触控优化';position:fixed;right:12px;bottom:84px;z-index:99;
      font:12px var(--font-ui);color:var(--ink-soft);background:rgba(255,255,255,.9);border:1px solid var(--line);border-radius:8px;padding:6px 9px;pointer-events:none}
  }
</style>

<div id="topbar">
  <button class="tbtn" id="menuBtn" aria-label="打开导图库">☰</button>
  <div id="brand"><div class="logo">M</div><span class="word">导图工坊</span></div>
  <input id="mapTitle" value="" aria-label="导图标题" maxlength="120">
  <div id="saveState"><div id="saveDot"></div><span id="saveText">…</span></div>
  <div id="exportWrap">
    <button class="tbtn" id="exportBtn">导出 ▾</button>
    <div id="exportMenu">
      <button data-exp="png">PNG 图片</button>
      <button data-exp="jpg">JPG 图片</button>
      <button data-exp="json">JSON 备份</button>
      <button data-exp="md">Markdown 大纲</button>
    </div>
  </div>
  <button class="tbtn" id="importBtn">导入</button>
  <input type="file" id="importFile" accept=".json,.md,.markdown,.txt" hidden>
</div>

<aside id="sidebar">
  <h2>我的导图库</h2>
  <button id="newMapBtn">＋ 新建导图</button>
  <div id="mapList" role="list"></div>
  <div id="sideFoot">
    <button class="tbtn" id="dupBtn">复制当前</button>
    <button class="tbtn" id="mdBtn">导出大纲</button>
  </div>
</aside>
<div id="scrim"></div>

<div id="stage">
  <svg id="svg" xmlns="http://www.w3.org/2000/svg">
    <g id="viewport"><g id="linkLayer"></g><g id="nodeLayer"></g><g id="freeTextLayer"></g></g>
  </svg>
</div>

<div id="toolbar">
  <button id="addChildBtn">子节点<kbd>Tab</kbd></button>
  <button id="addSibBtn">同级节点<kbd>Enter</kbd></button>
  <button id="editBtn">编辑<kbd>双击</kbd></button>
  <button id="noteBtn">备注<kbd>N</kbd></button>
  <button id="freeTextBtn">自由文字<kbd>T</kbd></button>
  <button id="delBtn">删除<kbd>Del</kbd></button>
  <button id="fontDownBtn" class="freeTextOnly" title="缩小自由文字">A−</button>
  <button id="fontUpBtn" class="freeTextOnly" title="放大自由文字">A＋</button>
  <div class="sep"></div>
  <button id="undoBtn">撤销</button>
  <button id="redoBtn">重做</button>
  <div class="sep"></div>
  <button id="zoomOutBtn">−</button>
  <button id="fitBtn">适应</button>
  <button id="zoomInBtn">＋</button>
</div>
<div id="hint">单指拖空白处移动画布 · 双指缩放 · 拖节点移动 · 右下角控制点拉伸</div>

<input id="nodeEditor" autocomplete="off">
<textarea id="freeTextEditor" autocomplete="off"></textarea>

<aside id="notePanel" aria-label="节点备注">
  <div id="noteHead"><span id="noteTitle"></span><button id="noteClose" title="关闭 (Esc)">✕</button></div>
  <textarea id="noteText" placeholder="给这个节点写备注……&#10;&#10;节点上留关键词,详细解释写在这里。&#10;备注会随导图自动保存,并包含在导出中。"></textarea>
  <div id="noteMeta">自动保存 · 有备注的节点右上角显示 ≡ 标记</div>
</aside>
<div id="toast"></div>

<script>
'use strict';
/* ================= 常量与状态 ================= */
const STORE_KEY='mindmap-app-v1';
const BRANCH=['#0E8A7B','#4F5DDE','#D98E04','#D6456B','#7B4FD8','#0A87B8','#7A8C1E','#E05D3A'];
const H_GAP=56, V_GAP=14, PAD_X=14, PAD_Y=8, FONT='14px "PingFang SC","Microsoft YaHei",system-ui,sans-serif';

let app={maps:[],currentId:null};      // 全部数据
let sel=null;                          // 选中节点 id
let freeSel=null;                      // 选中的自由文字 id
let placingFreeText=false;             // 等待在画布放置自由文字
let view={x:0,y:0,k:1};                // 平移缩放
let pos={};                            // id -> {x,y,w,h,color,node,parent}
let undoStack=[],redoStack=[];
let storageOK=true, saveTimer=null, memoryOnly=false;

const $=id=>document.getElementById(id);
const uid=()=> (crypto.randomUUID?crypto.randomUUID():'id'+Math.random().toString(36).slice(2)+Date.now());
const svgNS='http://www.w3.org/2000/svg';
const measureCtx=document.createElement('canvas').getContext('2d');
measureCtx.font=FONT;

/* ================= 数据模型 ================= */
function newNode(text){return{id:uid(),text,children:[],collapsed:false,manualX:null,manualY:null,manualW:null,manualH:null};}
function newMap(title){
  const root=newNode(title||'中心主题');
  root.children=[newNode('分支 1'),newNode('分支 2'),newNode('分支 3')];
  return{id:uid(),title:title||'未命名导图',updatedAt:Date.now(),root,freeTexts:[]};
}
function currentMap(){return app.maps.find(m=>m.id===app.currentId);}
function findNode(root,id,parent=null){
  if(root.id===id)return{node:root,parent};
  for(const c of root.children){const r=findNode(c,id,root);if(r)return r;}
  return null;
}
function countDesc(n){return n.children.reduce((s,c)=>s+1+countDesc(c),0);}

/* ================= 持久化存储 =================
   双模式:在 claude.ai 用 window.storage;
   本地打开(file://)用浏览器 localStorage,真正离线储存 */
function hasLocal(){try{localStorage.setItem('_t','1');localStorage.removeItem('_t');return true;}catch(e){return false;}}
async function loadAll(){
  try{
    if(window.storage){
      const r=await window.storage.get(STORE_KEY);
      if(r&&r.value)app=JSON.parse(r.value);
    }else if(hasLocal()){
      const v=localStorage.getItem(STORE_KEY);
      if(v)app=JSON.parse(v);
    }else{memoryOnly=true;storageOK=false;}
  }catch(e){ /* 键不存在:首次使用,忽略 */ }
  if(!app.maps||!app.maps.length){
    app={maps:[sampleMap()],currentId:null};
    app.currentId=app.maps[0].id;
    scheduleSave();
  }
  if(!currentMap())app.currentId=app.maps[0].id;
  app.maps.forEach(m=>{
    if(!Array.isArray(m.freeTexts))m.freeTexts=[];
    (function migrateNode(n){
      if(n.manualX===undefined)n.manualX=null;if(n.manualY===undefined)n.manualY=null;
      if(n.manualW===undefined)n.manualW=null;if(n.manualH===undefined)n.manualH=null;
      (n.children||[]).forEach(migrateNode);
    })(m.root);
  });
}
function scheduleSave(){
  setSaveUI('dirty');
  clearTimeout(saveTimer);
  saveTimer=setTimeout(saveAll,700);
}
async function saveAll(){
  const m=currentMap(); if(m)m.updatedAt=Date.now();
  if(memoryOnly){setSaveUI('error');renderList();return;}
  try{
    if(window.storage){
      const r=await window.storage.set(STORE_KEY,JSON.stringify(app));
      storageOK=!!r;
    }else{
      localStorage.setItem(STORE_KEY,JSON.stringify(app));
      storageOK=true;
    }
    setSaveUI(storageOK?'saved':'error');
  }catch(e){storageOK=false;setSaveUI('error');}
  renderList();
}
function setSaveUI(state){
  const dot=$('saveDot'),txt=$('saveText');
  dot.className='';
  if(state==='saved'){dot.classList.add('saved');const t=new Date();
    txt.textContent='已保存 '+String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0');}
  else if(state==='dirty'){dot.classList.add('dirty');txt.textContent='正在保存…';}
  else{dot.classList.add('error');txt.textContent=memoryOnly?'仅本次会话':'保存失败';}
}

/* ================= 撤销 / 重做 ================= */
function mapSnapshot(m){return JSON.stringify({root:m.root,freeTexts:m.freeTexts||[]});}
function restoreSnapshot(m,raw){
  const data=JSON.parse(raw);
  if(data&&data.root){m.root=data.root;m.freeTexts=data.freeTexts||[];}
  else{m.root=data;m.freeTexts=m.freeTexts||[];}
}
function snapshot(){
  const m=currentMap();if(!m)return;
  undoStack.push(mapSnapshot(m));
  if(undoStack.length>60)undoStack.shift();
  redoStack=[];updateUndoUI();
}
function undo(){
  const m=currentMap();if(!m||!undoStack.length)return;
  redoStack.push(mapSnapshot(m));
  restoreSnapshot(m,undoStack.pop());
  sel=m.root.id;freeSel=null;afterChange();
}
function redo(){
  const m=currentMap();if(!m||!redoStack.length)return;
  undoStack.push(mapSnapshot(m));
  restoreSnapshot(m,redoStack.pop());
  sel=m.root.id;freeSel=null;afterChange();
}
function updateUndoUI(){$('undoBtn').disabled=!undoStack.length;$('redoBtn').disabled=!redoStack.length;}

/* ================= 布局 ================= */
const WRAP_W=280; // 自动布局时的最大文字宽度
function wrapText(text,maxTextW=WRAP_W){
  const out=[];
  maxTextW=Math.max(24,maxTextW);
  for(const raw of String(text||' ').split('\n')){
    let line='';
    for(const ch of raw){
      if(line&&measureCtx.measureText(line+ch).width>maxTextW){out.push(line);line=ch;}
      else line+=ch;
    }
    out.push(line||' ');
  }
  return out;
}
function nodeSize(n){
  const extra=(n.note?14:0);
  const manualW=n.manualW?Math.max(80,n.manualW):null;
  const textW=manualW?Math.max(24,manualW-PAD_X*2-extra):WRAP_W;
  const lines=wrapText(n.text,textW);
  const naturalTextW=Math.max(...lines.map(l=>measureCtx.measureText(l).width),24);
  const naturalW=naturalTextW+PAD_X*2+extra;
  const naturalH=lines.length*20+PAD_Y*2;
  return{w:manualW||naturalW,h:n.manualH?Math.max(naturalH,n.manualH):naturalH,lines};
}
function layout(){
  pos={};const m=currentMap();if(!m)return;

  // 先计算每个子树真正需要的高度。这样即使某个节点被拉得很高，
  // 它也会为自己占出空间，不会再压到下面的兄弟节点。
  const metrics=new Map();
  function measureTree(n){
    const size=nodeSize(n),kids=(!n.collapsed)?n.children:[];
    let childrenH=0;
    if(kids.length){
      kids.forEach((c,i)=>{childrenH+=measureTree(c).subH+(i?V_GAP:0);});
    }
    const subH=Math.max(size.h,childrenH||0);
    const info={...size,subH,childrenH};metrics.set(n.id,info);return info;
  }
  measureTree(m.root);

  function place(n,depth,autoX,top,color,parent){
    const mt=metrics.get(n.id),kids=(!n.collapsed)?n.children:[];
    const autoY=top+(mt.subH-mt.h)/2;
    const x=Number.isFinite(n.manualX)?n.manualX:autoX;
    const y=Number.isFinite(n.manualY)?n.manualY:autoY;
    const entry={node:n,parent,x,y,w:mt.w,h:mt.h,lines:mt.lines,color,depth};
    pos[n.id]=entry;

    if(kids.length){
      let childTop=top+(mt.subH-mt.childrenH)/2;
      kids.forEach((c,i)=>{
        const cm=metrics.get(c.id);
        const col=depth===0?BRANCH[i%BRANCH.length]:color;
        // 未手动定位的孩子，以“父节点当前真实位置”的右侧作为起点。
        place(c,depth+1,x+mt.w+H_GAP,childTop,col,n);
        childTop+=cm.subH+V_GAP;
      });
    }
    return entry;
  }
  place(m.root,0,0,0,'#1E2B2A',null);
}

// 进入自由布局后，把当前可见节点的位置锁成绝对坐标。
// 这样新增节点、拉伸某个节点时，其他已有节点不会被自动布局重新洗牌。
function freezeCurrentPositions(){
  if(!Object.keys(pos).length)layout();
  for(const id in pos){
    const p=pos[id],n=p.node;
    if(!Number.isFinite(n.manualX))n.manualX=p.x;
    if(!Number.isFinite(n.manualY))n.manualY=p.y;
  }
}

/* ================= 渲染 ================= */
function render(){
  layout();
  const linkL=$('linkLayer'),nodeL=$('nodeLayer'),freeL=$('freeTextLayer');
  linkL.innerHTML='';nodeL.innerHTML='';freeL.innerHTML='';
  for(const id in pos){
    const p=pos[id],n=p.node;
    if(p.parent){
      const pp=pos[p.parent.id];
      const x1=pp.x+pp.w,y1=pp.y+pp.h/2,x2=p.x,y2=p.y+p.h/2,mx=(x1+x2)/2;
      const path=document.createElementNS(svgNS,'path');
      path.setAttribute('d',`M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`);
      path.setAttribute('class','link');path.setAttribute('stroke',p.color);
      linkL.appendChild(path);
    }
    const g=document.createElementNS(svgNS,'g');
    g.setAttribute('class','node-box'+(p.depth===0?' root':'')+(sel===id?' selected':''));
    g.setAttribute('transform',`translate(${p.x},${p.y})`);
    g.dataset.id=id;
    const rect=document.createElementNS(svgNS,'rect');
    rect.setAttribute('width',p.w);rect.setAttribute('height',p.h);
    rect.setAttribute('rx',9);rect.setAttribute('stroke',p.color);
    g.appendChild(rect);
    p.lines.forEach((line,i)=>{
      const t=document.createElementNS(svgNS,'text');
      t.setAttribute('x',PAD_X);t.setAttribute('y',PAD_Y+15+i*20);
      t.textContent=line;g.appendChild(t);
    });
    if(n.note){
      const nf=document.createElementNS(svgNS,'text');
      nf.setAttribute('x',p.w-15);nf.setAttribute('y',15);
      nf.setAttribute('class','note-flag');
      nf.setAttribute('fill',p.depth===0?'#8FD4C9':p.color);
      nf.dataset.note=id;nf.textContent='≡';
      g.appendChild(nf);
    }
    const rh=document.createElementNS(svgNS,'rect');
    rh.setAttribute('class','node-resize-handle');rh.dataset.resizeNode=id;
    rh.setAttribute('x',p.w-13);rh.setAttribute('y',p.h-13);rh.setAttribute('width',26);rh.setAttribute('height',26);rh.setAttribute('rx',6);
    g.appendChild(rh);
    nodeL.appendChild(g);
    if(n.children.length){
      const tg=document.createElementNS(svgNS,'g');
      tg.setAttribute('class','toggle');tg.dataset.toggle=id;
      const cx=p.x+p.w+11,cy=p.y+p.h/2;
      const c=document.createElementNS(svgNS,'circle');
      c.setAttribute('cx',cx);c.setAttribute('cy',cy);
      c.setAttribute('r',n.collapsed?10:7);c.setAttribute('stroke',p.color);
      tg.appendChild(c);
      const tt=document.createElementNS(svgNS,'text');
      tt.setAttribute('x',cx);tt.setAttribute('y',cy+3.5);
      tt.setAttribute('fill',p.color);
      tt.textContent=n.collapsed?countDesc(n):'−';
      tg.appendChild(tt);
      nodeL.appendChild(tg);
    }
  }
  const m=currentMap();
  (m?.freeTexts||[]).forEach(ft=>{
    const fs=Math.max(10,Math.min(72,ft.size||18));
    const lines=String(ft.text||'文字').split('\n');
    measureCtx.font=`${fs}px "PingFang SC","Microsoft YaHei",system-ui,sans-serif`;
    const w=Math.max(20,...lines.map(line=>measureCtx.measureText(line||' ').width));
    const lineH=fs*1.35,h=Math.max(lineH,lines.length*lineH);
    const g=document.createElementNS(svgNS,'g');
    g.setAttribute('class','free-text'+(freeSel===ft.id?' selected':''));
    g.setAttribute('transform',`translate(${ft.x||0},${ft.y||0})`);
    g.dataset.freeText=ft.id;
    const hit=document.createElementNS(svgNS,'rect');
    hit.setAttribute('class','free-text-hit');
    hit.setAttribute('x',-5);hit.setAttribute('y',-5);
    hit.setAttribute('width',w+10);hit.setAttribute('height',h+10);hit.setAttribute('rx',5);
    g.appendChild(hit);
    const t=document.createElementNS(svgNS,'text');
    t.setAttribute('font-size',fs);
    lines.forEach((line,i)=>{
      const sp=document.createElementNS(svgNS,'tspan');
      sp.setAttribute('x',0);sp.setAttribute('y',i*lineH);sp.textContent=line||' ';t.appendChild(sp);
    });
    g.appendChild(t);freeL.appendChild(g);
  });
  measureCtx.font=FONT;
  $('toolbar').classList.toggle('free-text-selected',!!freeSel);

  applyView();
  $('mapTitle').value=currentMap()?currentMap().title:'';
}
function applyView(){
  $('viewport').setAttribute('transform',`translate(${view.x},${view.y}) scale(${view.k})`);
}
function afterChange(){render();scheduleSave();updateUndoUI();}

/* ================= 视图控制 ================= */
function fit(){
  const ids=Object.keys(pos);if(!ids.length)return;
  let minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9;
  ids.forEach(id=>{const p=pos[id];
    minX=Math.min(minX,p.x);minY=Math.min(minY,p.y);
    maxX=Math.max(maxX,p.x+p.w+24);maxY=Math.max(maxY,p.y+p.h);});
  const m=currentMap();
  (m?.freeTexts||[]).forEach(ft=>{
    const fs=ft.size||18;measureCtx.font=`${fs}px "PingFang SC","Microsoft YaHei",system-ui,sans-serif`;
    const ls=String(ft.text||'文字').split('\n'),w=Math.max(20,...ls.map(x=>measureCtx.measureText(x||' ').width)),h=ls.length*fs*1.35;
    minX=Math.min(minX,ft.x-8);minY=Math.min(minY,ft.y-8);maxX=Math.max(maxX,ft.x+w+8);maxY=Math.max(maxY,ft.y+h+8);
  });
  measureCtx.font=FONT;
  const st=$('stage'),W=st.clientWidth,H=st.clientHeight;
  const k=Math.min(1.4,Math.max(.25,Math.min((W-80)/(maxX-minX),(H-80)/(maxY-minY))));
  view.k=k;
  view.x=(W-(maxX-minX)*k)/2-minX*k;
  view.y=(H-(maxY-minY)*k)/2-minY*k;
  applyView();
}
function zoom(f,cx,cy){
  const st=$('stage'),r=st.getBoundingClientRect();
  cx=cx??r.width/2; cy=cy??r.height/2;
  const nk=Math.min(2.5,Math.max(.2,view.k*f));
  view.x=cx-(cx-view.x)*(nk/view.k);
  view.y=cy-(cy-view.y)*(nk/view.k);
  view.k=nk;applyView();
}

/* ================= 自由文字 ================= */
function findFreeText(id){return (currentMap()?.freeTexts||[]).find(x=>x.id===id);}
function stageToMap(clientX,clientY){
  const r=$('stage').getBoundingClientRect();
  return{x:(clientX-r.left-view.x)/view.k,y:(clientY-r.top-view.y)/view.k};
}
function beginPlaceFreeText(){
  placingFreeText=true;freeSel=null;sel=null;render();toast('点一下画布空白处放置文字');
}
function addFreeTextAt(clientX,clientY){
  const m=currentMap();if(!m)return;
  const pt=stageToMap(clientX,clientY);snapshot();
  const ft={id:uid(),text:'输入文字',x:pt.x,y:pt.y,size:18};
  m.freeTexts=m.freeTexts||[];m.freeTexts.push(ft);placingFreeText=false;freeSel=ft.id;sel=null;
  afterChange();startFreeTextEdit(ft.id,true);
}
let editingFreeText=null;
function startFreeTextEdit(id,selectAll){
  const ft=findFreeText(id);if(!ft)return;editingFreeText=id;
  const ed=$('freeTextEditor'),stR=$('stage').getBoundingClientRect();
  ed.value=ft.text||'';ed.style.display='block';
  ed.style.left=(stR.left+view.x+ft.x*view.k)+'px';
  ed.style.top=(stR.top+view.y+ft.y*view.k)+'px';
  ed.style.fontSize=((ft.size||18)*view.k)+'px';
  ed.style.width=Math.max(140,220*view.k)+'px';ed.style.height=Math.max(50,70*view.k)+'px';
  ed.focus();if(selectAll)ed.select();
}
function commitFreeTextEdit(cancel){
  const ed=$('freeTextEditor'),ft=editingFreeText&&findFreeText(editingFreeText);
  if(ft&&!cancel){
    const nv=ed.value.trim();
    if(nv&&nv!==ft.text){snapshot();ft.text=nv;afterChange();}
  }
  editingFreeText=null;ed.style.display='none';render();
}
function resizeFreeText(delta){
  const ft=findFreeText(freeSel);if(!ft)return;snapshot();ft.size=Math.max(10,Math.min(72,(ft.size||18)+delta));afterChange();
}
function deleteFreeText(){
  const m=currentMap();if(!m||!freeSel)return;snapshot();
  m.freeTexts=(m.freeTexts||[]).filter(x=>x.id!==freeSel);freeSel=null;afterChange();
}

/* ================= 节点操作 ================= */
function addChild(){
  const m=currentMap();if(!m||!sel)return;
  const r=findNode(m.root,sel);if(!r)return;
  layout();
  const pp=pos[r.node.id];
  snapshot();freezeCurrentPositions();
  const c=newNode('新节点');
  // 新节点直接放在父节点右侧，不重新排列已有节点。
  c.manualX=pp.x+pp.w+H_GAP;
  c.manualY=pp.y+Math.max(0,(pp.h-36)/2);
  r.node.collapsed=false;r.node.children.push(c);
  sel=c.id;afterChange();startEdit(c.id,true);
}
function addSibling(){
  const m=currentMap();if(!m||!sel)return;
  const r=findNode(m.root,sel);if(!r)return;
  if(!r.parent){addChild();return;}
  layout();
  const sp=pos[r.node.id];
  snapshot();freezeCurrentPositions();
  const c=newNode('新节点');
  // 同级节点默认出现在当前节点下方；已有节点位置保持不动。
  c.manualX=sp.x;
  c.manualY=sp.y+sp.h+V_GAP;
  const i=r.parent.children.indexOf(r.node);
  r.parent.children.splice(i+1,0,c);
  sel=c.id;afterChange();startEdit(c.id,true);
}
function delNode(){
  if(freeSel){deleteFreeText();return;}
  const m=currentMap();if(!m||!sel)return;
  const r=findNode(m.root,sel);if(!r||!r.parent){toast('中心主题不能删除');return;}
  snapshot();
  const i=r.parent.children.indexOf(r.node);
  r.parent.children.splice(i,1);
  if(noteOpenFor&&!findNode(m.root,noteOpenFor))closeNote();
  sel=r.parent.children[Math.min(i,r.parent.children.length-1)]?.id||r.parent.id;
  afterChange();
}
function toggleCollapse(id){
  const m=currentMap();const r=findNode(m.root,id);if(!r)return;
  r.node.collapsed=!r.node.collapsed;afterChange();
}

/* ================= 行内编辑 ================= */
let editingId=null;
function startEdit(id,selectAll){
  const p=pos[id];if(!p)return;freeSel=null;
  editingId=id;
  const ed=$('nodeEditor'),stR=$('stage').getBoundingClientRect();
  ed.value=p.node.text;
  ed.style.display='block';
  ed.style.left=(stR.left+view.x+p.x*view.k)+'px';
  ed.style.top=(stR.top+view.y+p.y*view.k)+'px';
  ed.style.width=Math.max(80,p.w*view.k)+'px';
  ed.style.fontSize=(14*view.k)+'px';
  ed.focus();if(selectAll)ed.select();
}
function commitEdit(cancel){
  const ed=$('nodeEditor');
  if(editingId&&!cancel){
    const m=currentMap(),r=findNode(m.root,editingId);
    if(r&&r.node.text!==ed.value.trim()){
      snapshot();r.node.text=ed.value.trim()||'未命名';
      afterChange();
    }
  }
  editingId=null;ed.style.display='none';render();
}

/* ================= 节点备注 ================= */
let noteOpenFor=null,noteSnapDone=false;
function openNote(id){
  if(!id)return;
  const m=currentMap(),r=findNode(m.root,id);if(!r)return;
  noteOpenFor=id;noteSnapDone=false;
  $('noteTitle').textContent=r.node.text;
  $('noteText').value=r.node.note||'';
  $('notePanel').classList.add('open');
  $('noteText').focus();
}
function closeNote(){
  if(!noteOpenFor)return;
  noteOpenFor=null;
  $('notePanel').classList.remove('open');
  render(); // 更新 ≡ 标记
}

/* ================= 导图库 ================= */
function renderList(){
  const list=$('mapList');list.innerHTML='';
  [...app.maps].sort((a,b)=>b.updatedAt-a.updatedAt).forEach((m,i)=>{
    const item=document.createElement('div');
    item.className='map-item'+(m.id===app.currentId?' active':'');
    item.setAttribute('role','listitem');
    const d=new Date(m.updatedAt);
    item.innerHTML=`<div class="swatch" style="background:${BRANCH[i%BRANCH.length]}"></div>
      <div class="meta"><div class="name"></div>
      <div class="time">${d.getMonth()+1}月${d.getDate()}日 ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')} · ${1+countDesc(m.root)} 个节点</div></div>
      <button class="del" title="删除此导图">✕</button>`;
    item.querySelector('.name').textContent=m.title;
    item.addEventListener('click',e=>{
      if(e.target.classList.contains('del')){
        if(app.maps.length===1){toast('至少保留一张导图');return;}
        if(!confirm(`删除「${m.title}」?此操作不可撤销。`))return;
        app.maps=app.maps.filter(x=>x.id!==m.id);
        if(app.currentId===m.id){app.currentId=app.maps[0].id;switchReset();}
        afterChange();return;
      }
      if(m.id!==app.currentId){app.currentId=m.id;switchReset();render();fit();scheduleSave();}
      closeSidebar();
    });
    list.appendChild(item);
  });
}
function switchReset(){sel=currentMap().root.id;freeSel=null;placingFreeText=false;undoStack=[];redoStack=[];updateUndoUI();closeNote();}

/* ================= 导入导出 =================
   优先用「另存为」对话框(Chrome/Edge):可以自己选文件夹,
   浏览器会记住上次的位置;不支持时退回普通下载 */
async function download(name,text,type,ext){
  if(window.showSaveFilePicker){
    try{
      const h=await window.showSaveFilePicker({
        suggestedName:name,
        types:[{description:type,accept:{[type]:[ext]}}]
      });
      const w=await h.createWritable();
      await w.write(text);await w.close();
      return true;
    }catch(e){
      if(e.name==='AbortError')return false;  // 用户取消
      /* 其他错误退回普通下载 */
    }
  }
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([text],{type}));
  a.download=name;a.click();URL.revokeObjectURL(a.href);
  return true;
}
async function exportJSON(){
  const m=currentMap();if(!m)return;
  const ok=await download(m.title+'.json',JSON.stringify(m,null,2),'application/json','.json');
  if(ok)toast('已导出 JSON(可用「导入」恢复)');
}
async function exportMarkdown(){
  const m=currentMap();if(!m)return;
  let out='# '+m.root.text+'\n\n';
  if(m.root.note)out+='> '+m.root.note.replace(/\n/g,'\n> ')+'\n\n';
  (function walk(n,d){n.children.forEach(c=>{
    out+='  '.repeat(d)+'- '+c.text+'\n';
    if(c.note)out+='  '.repeat(d+1)+'> '+c.note.replace(/\n/g,'\n'+'  '.repeat(d+1)+'> ')+'\n';
    walk(c,d+1);
  });})(m.root,0);
  const ok=await download(m.title+'.md',out,'text/markdown','.md');
  if(ok)toast('已导出 Markdown 大纲');
}
/* ---- Markdown 大纲 → 导图树 ----
   支持:# 标题(层级)、项目符号(-、*、+)、> 备注、[ ] 待办前缀
*/
function parseMarkdown(text,fallbackTitle){
  const lines=text.replace(/\r/g,'').split('\n');
  const sentinel={id:uid(),text:fallbackTitle||'导入的导图',children:[],collapsed:false,depth:-2};
  const stack=[sentinel];
  let lastNode=sentinel,lastHeadBase=-1;
  const top=()=>stack[stack.length-1];
  for(const raw of lines){
    if(!raw.trim())continue;
    // 备注行:> ...
    const nm=raw.match(/^\s*>\s?(.*)$/);
    if(nm){lastNode.note=(lastNode.note?lastNode.note+'\n':'')+nm[1];continue;}
    let depth,txt;
    const hm=raw.match(/^(#{1,6})\s+(.*)$/);
    if(hm){depth=hm[1].length-1;txt=hm[2].trim();lastHeadBase=depth;}
    else{
      const bm=raw.match(/^(\s*)(?:[-*+]\s+)?(.*)$/);
      const indent=bm[1].replace(/\t/g,'  ').length;
      depth=lastHeadBase+1+Math.floor(indent/2);
      txt=bm[2].trim();
    }
    txt=txt.replace(/^\[[ xX]\]\s*/,'').replace(/\*\*/g,'').trim();
    if(!txt)continue;
    const node={id:uid(),text:txt,children:[],collapsed:false,depth,manualX:null,manualY:null,manualW:null,manualH:null};
    while(stack.length>1&&top().depth>=depth)stack.pop();
    top().children.push(node);stack.push(node);lastNode=node;
  }
  function clean(n){delete n.depth;n.children.forEach(clean);}
  let root;
  if(sentinel.children.length===1)root=sentinel.children[0];
  else root={id:uid(),text:fallbackTitle||'导入的导图',children:sentinel.children,collapsed:false,note:sentinel.note};
  clean(root);
  if(!root.children.length&&root.text===(fallbackTitle||'导入的导图'))return null;
  return root;
}

function importFile(file){
  const rd=new FileReader();
  const base=file.name.replace(/\.[^.]+$/,'');
  rd.onload=()=>{
    const raw=rd.result;
    // 先尝试 JSON 备份
    try{
      const m=JSON.parse(raw);
      if(m&&m.root&&m.root.text){
        m.id=uid();m.updatedAt=Date.now();m.title=(m.title||base||'导入的导图');m.freeTexts=m.freeTexts||[];
        (function reid(n){n.id=uid();(n.children||[]).forEach(reid);n.children=n.children||[];})(m.root);
        app.maps.unshift(m);app.currentId=m.id;switchReset();
        afterChange();fit();toast('已导入 JSON 备份');return;
      }
    }catch(e){/* 不是 JSON,当作 Markdown */}
    // 再尝试 Markdown / 文本大纲
    const root=parseMarkdown(raw,base);
    if(!root){toast('无法识别的文件内容');return;}
    const map={id:uid(),title:base||'导入的大纲',updatedAt:Date.now(),root,freeTexts:[]};
    app.maps.unshift(map);app.currentId=map.id;switchReset();
    afterChange();fit();toast('已从 Markdown 大纲生成导图');
  };
  rd.readAsText(file);
}

/* ---- 图片导出:把整张图渲染到 canvas ---- */
function mapBounds(){
  const ids=Object.keys(pos);
  let minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9;
  ids.forEach(id=>{const p=pos[id];
    minX=Math.min(minX,p.x);minY=Math.min(minY,p.y);
    maxX=Math.max(maxX,p.x+p.w+(p.node.children.length?26:0));
    maxY=Math.max(maxY,p.y+p.h);});
  (currentMap()?.freeTexts||[]).forEach(ft=>{
    const fs=ft.size||18;measureCtx.font=`${fs}px "PingFang SC","Microsoft YaHei",system-ui,sans-serif`;
    const ls=String(ft.text||'文字').split('\n'),w=Math.max(20,...ls.map(x=>measureCtx.measureText(x||' ').width)),h=ls.length*fs*1.35;
    minX=Math.min(minX,ft.x-8);minY=Math.min(minY,ft.y-8);maxX=Math.max(maxX,ft.x+w+8);maxY=Math.max(maxY,ft.y+h+8);
  });
  measureCtx.font=FONT;
  return{minX,minY,maxX,maxY};
}
async function exportImage(fmt){
  const m=currentMap();if(!m)return;
  layout();
  const M=40,b=mapBounds();
  const w=b.maxX-b.minX+M*2,h=b.maxY-b.minY+M*2,scale=2;
  // 克隆当前 SVG 内容(节点+连线),设定为整图范围
  const src=$('svg');
  const clone=src.cloneNode(true);
  clone.setAttribute('viewBox',`${b.minX-M} ${b.minY-M} ${w} ${h}`);
  clone.setAttribute('width',w);clone.setAttribute('height',h);
  clone.querySelector('#viewport').removeAttribute('transform'); // 取消平移缩放
  // 把外部样式内联进 SVG,保证字体/颜色正确
  const css=`
    .link{fill:none;stroke-width:2.2px;opacity:.85}
    .node-box rect{fill:#fff;stroke-width:2px}
    .node-box.root rect{fill:#1E2B2A;stroke:#1E2B2A}
    .node-box.root text{fill:#fff}
    .node-box text{font:500 14px "PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1E2B2A}
    .toggle circle{fill:#fff;stroke-width:1.6px}
    .toggle text{font:700 10px system-ui;text-anchor:middle}
    .note-flag{font:700 13px system-ui}
    .free-text-hit{fill:transparent;stroke:transparent}
    .free-text text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#1E2B2A}`;
  const style=document.createElementNS(svgNS,'style');style.textContent=css;
  clone.insertBefore(style,clone.firstChild);
  // 选中态边框在导出里去掉
  clone.querySelectorAll('.node-box.selected').forEach(el=>el.classList.remove('selected'));
  clone.querySelectorAll('.free-text.selected').forEach(el=>el.classList.remove('selected'));
  clone.querySelectorAll('.free-text-hit').forEach(el=>el.remove());
  clone.querySelectorAll('.node-resize-handle').forEach(el=>el.remove());

  const data=new XMLSerializer().serializeToString(clone);
  const svgUrl='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(data);
  const img=new Image();
  await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;img.src=svgUrl;});

  const canvas=document.createElement('canvas');
  canvas.width=w*scale;canvas.height=h*scale;
  const ctx=canvas.getContext('2d');
  if(fmt==='jpg'){ctx.fillStyle='#F6F8F7';ctx.fillRect(0,0,canvas.width,canvas.height);}
  ctx.scale(scale,scale);ctx.drawImage(img,0,0);

  const type=fmt==='jpg'?'image/jpeg':'image/png';
  const blob=await new Promise(r=>canvas.toBlob(r,type,0.95));
  await downloadBlob(m.title+'.'+fmt,blob,type,'.'+fmt);
  toast('已导出 '+fmt.toUpperCase()+' 图片('+Math.round(w)+'×'+Math.round(h)+')');
}
async function downloadBlob(name,blob,type,ext){
  if(window.showSaveFilePicker){
    try{
      const hd=await window.showSaveFilePicker({suggestedName:name,
        types:[{description:type,accept:{[type]:[ext]}}]});
      const wr=await hd.createWritable();await wr.write(blob);await wr.close();return;
    }catch(e){if(e.name==='AbortError')return;}
  }
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=name;a.click();URL.revokeObjectURL(a.href);
}

/* ================= 交互绑定 ================= */
function toast(msg){
  const t=$('toast');t.textContent=msg;t.style.display='block';
  clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',2200);
}
function closeSidebar(){$('sidebar').classList.remove('open');$('scrim').classList.remove('open');}

function bind(){
  const stage=$('stage');
  /* 平移(Pointer Events,兼容触屏) */
  let panning=false,px=0,py=0,moved=false;
  stage.addEventListener('pointerdown',e=>{
    if(e.target.closest('.node-box,.toggle,.free-text'))return;
    panning=true;moved=false;px=e.clientX;py=e.clientY;
    stage.classList.add('panning');stage.setPointerCapture(e.pointerId);
  });
  stage.addEventListener('pointermove',e=>{
    if(pinching)return;
    if(!panning)return;
    const dx=e.clientX-px,dy=e.clientY-py;
    if(Math.abs(dx)+Math.abs(dy)>2)moved=true;
    view.x+=dx;view.y+=dy;px=e.clientX;py=e.clientY;applyView();
  });
  stage.addEventListener('pointerup',e=>{
    stage.classList.remove('panning');
    if(panning&&!moved&&!e.target.closest('.node-box,.toggle,.free-text')){
      if(placingFreeText){addFreeTextAt(e.clientX,e.clientY);panning=false;return;}
      sel=null;freeSel=null;render();
    }
    panning=false;
  });
  stage.addEventListener('wheel',e=>{
    e.preventDefault();
    const r=stage.getBoundingClientRect();
    zoom(e.deltaY<0?1.12:0.89,e.clientX-r.left,e.clientY-r.top);
  },{passive:false});

  /* 节点点击 / 双击 / 折叠 */
  let lastTap={id:null,t:0};
  $('svg').addEventListener('pointerup',e=>{
    if(e.target.closest('.node-resize-handle'))return;
    const nf=e.target.closest('.note-flag');
    if(nf){sel=nf.dataset.note;render();openNote(nf.dataset.note);return;}
    const tg=e.target.closest('.toggle');
    if(tg){toggleCollapse(tg.dataset.toggle);return;}
    const fg=e.target.closest('.free-text');
    if(fg){
      const id=fg.dataset.freeText,now=Date.now();sel=null;freeSel=id;render();
      if(lastTap.id===id&&now-lastTap.t<350){startFreeTextEdit(id,true);lastTap={id:null,t:0};return;}
      lastTap={id,t:now};return;
    }
    const nb=e.target.closest('.node-box');
    if(nb){
      const id=nb.dataset.id,now=Date.now();freeSel=null;
      if(lastTap.id===id&&now-lastTap.t<350){startEdit(id,true);lastTap={id:null,t:0};return;}
      lastTap={id,t:now};sel=id;render();
    }
  });

  /* 节点自由拖动 / 拉伸 */
  let draggingNode=null,nodeDragStartX=0,nodeDragStartY=0,nodeStartX=0,nodeStartY=0,nodeDragMoved=false;
  let resizingNode=null,resizeStartX=0,resizeStartY=0,resizeStartW=0,resizeStartH=0,resizeMoved=false;

  $('svg').addEventListener('pointerdown',e=>{
    const handle=e.target.closest('.node-resize-handle');
    if(handle){
      const r=findNode(currentMap().root,handle.dataset.resizeNode);if(!r)return;
      const p=pos[r.node.id];
      freezeCurrentPositions();resizingNode=r.node;resizeStartX=e.clientX;resizeStartY=e.clientY;resizeStartW=p.w;resizeStartH=p.h;resizeMoved=false;
      e.stopPropagation();$('svg').setPointerCapture?.(e.pointerId);return;
    }
    const nb=e.target.closest('.node-box');
    if(!nb||e.target.closest('.note-flag'))return;
    const r=findNode(currentMap().root,nb.dataset.id);if(!r)return;
    freezeCurrentPositions();draggingNode=r.node;nodeDragStartX=e.clientX;nodeDragStartY=e.clientY;nodeStartX=pos[r.node.id].x;nodeStartY=pos[r.node.id].y;nodeDragMoved=false;
    e.stopPropagation();$('svg').setPointerCapture?.(e.pointerId);
  });

  $('svg').addEventListener('pointermove',e=>{
    if(pinching)return;
    if(resizingNode){
      const dx=(e.clientX-resizeStartX)/view.k,dy=(e.clientY-resizeStartY)/view.k;
      if(Math.abs(dx)+Math.abs(dy)>1){
        if(!resizeMoved){snapshot();resizeMoved=true;}
        resizingNode.manualW=Math.max(80,resizeStartW+dx);
        resizingNode.manualH=Math.max(36,resizeStartH+dy);
        render();
      }
      return;
    }
    if(!draggingNode)return;
    const dx=(e.clientX-nodeDragStartX)/view.k,dy=(e.clientY-nodeDragStartY)/view.k;
    if(Math.abs(dx)+Math.abs(dy)>1){
      if(!nodeDragMoved){snapshot();nodeDragMoved=true;}
      draggingNode.manualX=nodeStartX+dx;draggingNode.manualY=nodeStartY+dy;render();
    }
  });

  $('svg').addEventListener('pointerup',e=>{
    if(resizingNode){if(resizeMoved)scheduleSave();sel=resizingNode.id;resizingNode=null;render();return;}
    if(draggingNode){if(nodeDragMoved)scheduleSave();sel=draggingNode.id;draggingNode=null;render();}
  });

  /* 自由文字拖动 */
  let draggingFT=null,dragStartX=0,dragStartY=0,ftStartX=0,ftStartY=0,ftDragMoved=false;
  $('svg').addEventListener('pointerdown',e=>{
    const fg=e.target.closest('.free-text');if(!fg)return;
    const ft=findFreeText(fg.dataset.freeText);if(!ft)return;
    draggingFT=ft;dragStartX=e.clientX;dragStartY=e.clientY;ftStartX=ft.x;ftStartY=ft.y;ftDragMoved=false;
    e.stopPropagation();$('svg').setPointerCapture?.(e.pointerId);
  });
  $('svg').addEventListener('pointermove',e=>{
    if(pinching)return;
    if(!draggingFT)return;
    const dx=(e.clientX-dragStartX)/view.k,dy=(e.clientY-dragStartY)/view.k;
    if(Math.abs(dx)+Math.abs(dy)>1){
      if(!ftDragMoved){snapshot();ftDragMoved=true;}
      draggingFT.x=ftStartX+dx;draggingFT.y=ftStartY+dy;render();
    }
  });
  $('svg').addEventListener('pointerup',e=>{
    if(!draggingFT)return;
    if(ftDragMoved){scheduleSave();}
    freeSel=draggingFT.id;draggingFT=null;render();
  });

  /* 手机双指缩放：两指中心保持在原来的导图位置 */
  let pinchStartDist=0,pinchStartK=1,pinchAnchorMap=null,pinching=false;
  const touchDist=t=>{const a=t[0],b=t[1];return Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY)};
  const touchMid=t=>({x:(t[0].clientX+t[1].clientX)/2,y:(t[0].clientY+t[1].clientY)/2});
  stage.addEventListener('touchstart',e=>{
    if(e.touches.length===2){
      e.preventDefault();pinching=true;panning=false;draggingNode=null;resizingNode=null;draggingFT=null;
      stage.classList.remove('panning');
      pinchStartDist=touchDist(e.touches);pinchStartK=view.k;
      const mid=touchMid(e.touches),r=stage.getBoundingClientRect();
      pinchAnchorMap={x:(mid.x-r.left-view.x)/view.k,y:(mid.y-r.top-view.y)/view.k};
    }
  },{passive:false});
  stage.addEventListener('touchmove',e=>{
    if(!pinching||e.touches.length!==2)return;
    e.preventDefault();
    const d=touchDist(e.touches);if(!pinchStartDist)return;
    const nk=Math.min(3.2,Math.max(.18,pinchStartK*d/pinchStartDist));
    const mid=touchMid(e.touches),r=stage.getBoundingClientRect();
    view.k=nk;
    view.x=mid.x-r.left-pinchAnchorMap.x*nk;
    view.y=mid.y-r.top-pinchAnchorMap.y*nk;
    applyView();
  },{passive:false});
  stage.addEventListener('touchend',e=>{if(e.touches.length<2){pinching=false;pinchStartDist=0;}},{passive:false});

  /* 键盘 */
  document.addEventListener('keydown',e=>{
    const ed=$('nodeEditor'),fed=$('freeTextEditor');
    if(document.activeElement===ed){
      if(e.key==='Enter'){e.preventDefault();commitEdit(false);}
      if(e.key==='Escape'){commitEdit(true);}
      return;
    }
    if(document.activeElement===fed){
      if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();commitFreeTextEdit(false);}
      if(e.key==='Escape'){e.preventDefault();commitFreeTextEdit(true);}
      return;
    }
    if(document.activeElement===$('mapTitle'))return;
    if(document.activeElement===$('noteText')){
      if(e.key==='Escape'){e.preventDefault();closeNote();}
      return;
    }
    if(e.key==='Escape'&&noteOpenFor){closeNote();return;}
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){
      e.preventDefault();e.shiftKey?redo():undo();return;
    }
    if(e.key==='t'||e.key==='T'){e.preventDefault();beginPlaceFreeText();return;}
    if(freeSel){
      if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();deleteFreeText();}
      else if(e.key==='F2'||e.key===' '||e.key==='Enter'){e.preventDefault();startFreeTextEdit(freeSel,true);}
      else if((e.ctrlKey||e.metaKey)&&e.key==='='){e.preventDefault();resizeFreeText(2);}
      else if((e.ctrlKey||e.metaKey)&&e.key==='-'){e.preventDefault();resizeFreeText(-2);}
      return;
    }
    if(!sel)return;
    if(e.key==='Tab'){e.preventDefault();addChild();}
    else if(e.key==='Enter'){e.preventDefault();addSibling();}
    else if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();delNode();}
    else if(e.key==='F2'||e.key===' '){e.preventDefault();startEdit(sel,true);}
    else if(e.key==='n'||e.key==='N'){e.preventDefault();openNote(sel);}
  });
  $('nodeEditor').addEventListener('blur',()=>commitEdit(false));
  $('freeTextEditor').addEventListener('blur',()=>commitFreeTextEdit(false));

  /* 工具栏 */
  $('addChildBtn').onclick=addChild;
  $('addSibBtn').onclick=addSibling;
  $('editBtn').onclick=()=>freeSel?startFreeTextEdit(freeSel,true):(sel&&startEdit(sel,true));
  $('noteBtn').onclick=()=>openNote(sel);
  $('freeTextBtn').onclick=beginPlaceFreeText;
  $('fontDownBtn').onclick=()=>resizeFreeText(-2);
  $('fontUpBtn').onclick=()=>resizeFreeText(2);
  $('noteClose').onclick=closeNote;
  $('noteText').addEventListener('input',()=>{
    if(!noteOpenFor)return;
    const r=findNode(currentMap().root,noteOpenFor);if(!r)return;
    if(!noteSnapDone){snapshot();noteSnapDone=true;}
    const v=$('noteText').value;
    r.node.note=v.trim()?v:undefined;
    scheduleSave();
  });
  $('delBtn').onclick=delNode;
  $('undoBtn').onclick=undo;
  $('redoBtn').onclick=redo;
  $('zoomInBtn').onclick=()=>zoom(1.2);
  $('zoomOutBtn').onclick=()=>zoom(0.83);
  $('fitBtn').onclick=fit;

  /* 顶栏与侧栏 */
  $('mapTitle').addEventListener('input',()=>{
    const m=currentMap();if(!m)return;
    m.title=$('mapTitle').value||'未命名导图';scheduleSave();
  });
  $('mapTitle').addEventListener('keydown',e=>{if(e.key==='Enter')e.target.blur();});
  $('newMapBtn').onclick=()=>{
    const m=newMap('未命名导图');
    app.maps.unshift(m);app.currentId=m.id;switchReset();
    afterChange();fit();startEdit(m.root.id,true);closeSidebar();
  };
  $('dupBtn').onclick=()=>{
    const m=currentMap();if(!m)return;
    const cp=JSON.parse(JSON.stringify(m));
    cp.id=uid();cp.title=m.title+' 副本';cp.updatedAt=Date.now();
    (function reid(n){n.id=uid();n.children.forEach(reid);})(cp.root);
    app.maps.unshift(cp);app.currentId=cp.id;switchReset();
    afterChange();fit();toast('已创建副本');
  };
  $('mdBtn').onclick=exportMarkdown;
  const exMenu=$('exportMenu');
  $('exportBtn').onclick=e=>{e.stopPropagation();exMenu.classList.toggle('open');};
  exMenu.querySelectorAll('button').forEach(btn=>{
    btn.onclick=()=>{
      exMenu.classList.remove('open');
      const t=btn.dataset.exp;
      if(t==='png'||t==='jpg')exportImage(t);
      else if(t==='json')exportJSON();
      else if(t==='md')exportMarkdown();
    };
  });
  document.addEventListener('click',()=>exMenu.classList.remove('open'));
  $('importBtn').onclick=()=>$('importFile').click();
  $('importFile').addEventListener('change',e=>{
    if(e.target.files[0])importFile(e.target.files[0]);e.target.value='';
  });
  $('menuBtn').onclick=()=>{$('sidebar').classList.toggle('open');$('scrim').classList.toggle('open');};
  $('scrim').onclick=closeSidebar;
  window.addEventListener('resize',()=>applyView());
}

/* ================= 启动 ================= */
(async function init(){
  await loadAll();
  sel=currentMap().root.id;
  bind();
  render();renderList();fit();
  setSaveUI(memoryOnly?'error':'saved');
  if(memoryOnly)toast('当前浏览器不支持本地存储,数据仅保留在本次会话');
  else setTimeout(()=>toast('手机模式：单指移动 · 双指缩放 · 节点右下角可拉伸'),450);
})();
